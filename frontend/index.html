<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#246317" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonte de interface (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>DesospIdoso</title>
    <script>
      // Aplica o tema e as preferências salvas antes de desenhar a página (evita piscar)
      try {
        var t = localStorage.getItem('desospidoso.theme');
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        // Tamanho do texto, alto contraste e animações (Perfil > Preferências)
        var p = JSON.parse(localStorage.getItem('desospidoso.prefs') || '{}'), h = document.documentElement;
        if (p.textSize === 'grande' || p.textSize === 'muito-grande') h.setAttribute('data-text', p.textSize);
        if (p.highContrast) h.setAttribute('data-contrast', 'high');
        if (p.reduceMotion) h.setAttribute('data-motion', 'reduce');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
